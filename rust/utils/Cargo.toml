[package]
authors = ["langyo <langyo.china@gmail.com>"]
edition = "2021"
name = "_utils"
publish = false
version = "0.1.0"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "^1"
chrono = { version = "^0.4", features = [
  "serde",
  "wasmbind",
  "unstable-locales",
] }
log = "^0.4"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
strum = "^0.28"
strum_macros = "^0.28"
uuid = { version = "^1", features = [
  'v4',
  'js',  # 使用 WASM JS 特性而不是 fast-rng
  'macro-diagnostics',
  'serde',
] }
getrandom = { workspace = true }
