version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tsdm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: discuz
      MYSQL_USER: discuz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-discuz}
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations/from-x3/:/docker-entrypoint-initdb.d/
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tsdm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DISCUZ_IMAGE: ${DISCUZ_IMAGE:-discuz/discuzx:latest}
    container_name: tsdm_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: discuz
      DB_USER: discuz
      DB_PASSWORD: ${MYSQL_PASSWORD:-discuz}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - app_data:/var/www/html/data
      - app_static:/var/www/html/static
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"

volumes:
  db_data:
  app_data:
  app_static:
